name = "vibe-recruiter-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"

[[d1_databases]]
binding = "DB"
database_name = "vibe-recruiter-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[d1_databases.migrations]]
table = "d1_migrations"
dir = "migrations"

[vars]
ENVIRONMENT = "development"

# Secrets (set via wrangler secret put):
# PROXY_API_KEY
# JWT_SECRET
# OPENAI_API_KEY
# ANTHROPIC_API_KEY
# SERPER_API_KEY
